- type: markingsGroup
  parent: Undergarments
  id: Ferrodae
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FerrodaeTailDocked ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ FerrodaeCRT ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ FerrodaeEars ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 99
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: true
      default: [ FerrodaeLeftHandColor ]
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: true
      default: [ FerrodaeRightHandColor ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: true
      default: [ FerrodaeLeftLegColor ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: true
      default: [ FerrodaeRightLegColor ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFerrodae
