  name: ferrodae appearance
  components:
  - type: Inventory
    speciesId: ferrodae
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: hand
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: head
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: neck
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: ears
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_l
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_r
  - type: InitialBody
    organs:
      Torso: OrganFerrodaeTorso
      Head: OrganFerrodaeHead
      ArmLeft: OrganFerrodaeArmLeft
      ArmRight: OrganFerrodaeArmRight
      HandRight: OrganFerrodaeHandRight
      HandLeft: OrganFerrodaeHandLeft
      LegLeft: OrganFerrodaeLegLeft
      LegRight: OrganFerrodaeLegRight
      Brain: OrganFerrodaeBrain
      Eyes: OrganFerrodaeEyes
      Ears: OrganFerrodaeEars
      Lungs: OrganFerrodaeLungs
      Heart: OrganFerrodaeHeart
      Stomach: OrganFerrodaeStomach
      Liver: OrganFerrodaeLiver
      Kidneys: OrganFerrodaeKidneys
  - type: HumanoidProfile
    species: Ferrodae

- type: entity
  parent:
  - AppearanceFerrodae
  - BaseSpeciesMobOrganic
  id: MobFerrodae
  name: Urist McBaaaah
  components:
  - type: TypingIndicator
    proto: ferrodae
  - type: Butcherable
    spawned:
    - id: MicroManipulatorStockPart
      amount: 1
    - id: FoodMeat
      amount: 3
  - type: Damageable
    damageModifierSet: Scale

